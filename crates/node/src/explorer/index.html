<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boltchain Explorer</title>
<meta name="description" content="Boltchain block explorer">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #6a7280; --line: #e4e7ec;
  --accent: #d9480f; --accent-soft: #fff1e8; --ok: #2b8a3e; --ok-soft: #e6f4ea; --bad: #c92a2a;
  --bad-soft: #fdecec; --warn: #b7791f; --warn-soft: #fff6e0; --link: #1c5fd4; --code: #f1f3f5;
  --shadow: 0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #171a21; --text: #e6e8ec; --muted: #9aa3b2; --line: #272c36;
    --accent: #ff8a4c; --accent-soft: #2a1a10; --ok: #5cc27a; --ok-soft: #13261a; --bad: #ff6b6b;
    --bad-soft: #2d1515; --warn: #f0b64d; --warn-soft: #2a2312; --link: #7fb0ff; --code: #1f232c;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a21; --text: #e6e8ec; --muted: #9aa3b2; --line: #272c36;
  --accent: #ff8a4c; --accent-soft: #2a1a10; --ok: #5cc27a; --ok-soft: #13261a; --bad: #ff6b6b;
  --bad-soft: #2d1515; --warn: #f0b64d; --warn-soft: #2a2312; --link: #7fb0ff; --code: #1f232c;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC",
    "Microsoft JhengHei", Roboto, sans-serif;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.muted { color: var(--muted); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
header.top { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.bar { display: flex; align-items: center; gap: 16px; height: 60px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; color: var(--text); white-space: nowrap; }
.brand svg { width: 22px; height: 22px; }
.brand small { font-weight: 500; color: var(--muted); font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
nav.links { display: flex; gap: 14px; }
nav.links a { color: var(--muted); font-weight: 500; }
nav.links a.on { color: var(--text); }
form.search { flex: 1; display: flex; min-width: 0; }
form.search input {
  flex: 1; min-width: 0; height: 38px; border: 1px solid var(--line); border-radius: 10px 0 0 10px;
  background: var(--bg); color: var(--text); padding: 0 12px; font-size: 14px;
}
form.search button { height: 38px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 0 10px 10px 0; padding: 0 14px; cursor: pointer; font-weight: 600; }
.tools { display: flex; gap: 6px; }
.tools button { height: 32px; min-width: 32px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; cursor: pointer; font-size: 13px; padding: 0 8px; }
main.wrap { padding: 24px 16px 48px; }
h1 { font-size: 20px; margin: 4px 0 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2 { font-size: 15px; margin: 0; }
.grid { display: grid; gap: 12px; }
.grid > * { min-width: 0; }
.stats { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.stat { padding: 14px 16px; }
.stat .k { color: var(--muted); font-size: 12px; text-transform: none; }
.stat .v { font-size: 20px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } nav.links { display: none; } }
@media (max-width: 560px) { .brand small { display: none; } .bar { gap: 8px; } }
.card-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.list .row { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); min-width: 0; }
.list .row:last-child { border-bottom: 0; }
.row .ic { flex: none; width: 36px; height: 36px; border-radius: 9px; background: var(--code); display: grid; place-items: center; font-size: 12px; color: var(--muted); font-weight: 600; }
.row .main { flex: 1; min-width: 0; }
.row .main div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .side { text-align: right; flex: none; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; background: var(--code); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.acc { background: var(--accent-soft); color: var(--accent); }
table.kv { width: 100%; border-collapse: collapse; }
table.kv td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.kv tr:last-child td { border-bottom: 0; }
table.kv td:first-child { width: 220px; color: var(--muted); }
@media (max-width: 700px) { table.kv td { display: block; width: auto !important; } table.kv td:first-child { padding-bottom: 0; border-bottom: 0; } }
.break { word-break: break-all; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tbl th, table.tbl td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.tbl th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--bg); }
table.tbl td.r, table.tbl th.r { text-align: right; }
.scroll { overflow-x: auto; }
.pager { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.btn.acc { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.copy { cursor: pointer; color: var(--muted); margin-left: 6px; font-size: 12px; border: 0; background: none; }
.phase { padding: 16px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
@media (max-width: 700px) { .steps { grid-template-columns: 1fr; } }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.step.cur { border-color: var(--accent); background: var(--accent-soft); }
.step.done { opacity: .75; }
.step h3 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.step p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.meter { margin: 6px 0; font-size: 12px; }
.meter .t { display: flex; justify-content: space-between; color: var(--muted); }
.meter .b { height: 6px; background: var(--code); border-radius: 999px; overflow: hidden; margin-top: 3px; }
.meter .b i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.meter.full .b i { background: var(--ok); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.err { padding: 16px; border-radius: 12px; background: var(--bad-soft); color: var(--bad); }
.note { padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13px; margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.verify-out { margin-top: 8px; font-size: 13px; }
footer.wrap { color: var(--muted); font-size: 12px; padding: 20px 16px 32px; border-top: 1px solid var(--line); }
.spark { width: 100%; height: 44px; display: block; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; }
</style>
</head>

<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#/">

      Boltchain <small id="net">…</small>
    </a>
    <nav class="links">
      <a href="#/" data-nav="home" data-i18n="nav.home"></a>

    </nav>
    <form class="search" id="search">

    <div class="tools">

      <button id="theme" title="Theme">☾</button>

</header>
<main class="wrap" id="app"></main>

  lang = lang === "zh" ? "en" : "zh";

  applyI18n();

    ])}</div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h2>${t("e.audits")}</h2></div>
      ${e.audits.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>${t("e.provider")}</th><th>${t("e.target")}</th><th>${t("k.block")}</th><th>${t("k.status")}</th></tr></thead><tbody>
        ${e.audits.map((a) => `<tr><td>${a.task}</td><td><a href="#/validator/${a.provider}">#${a.provider}</a></td><td><a href="#/epoch/${a.target}">${a.target}</a></td><td>${bLink(a.height)}</td><td>${auditBadge(a.state)}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">${t("e.noaudits")}</div>`}</div>`;
}

// ---------- in-browser verification (keccak-256, sha-256, CID parsing) ----------
const RC = [
  "0x0000000000000001", "0x0000000000008082", "0x800000000000808a", "0x8000000080008000", "0x000000000000808b", "0x0000000080000001",
  "0x8000000080008081", "0x8000000000008009", "0x000000000000008a", "0x0000000000000088", "0x0000000080008009", "0x000000008000000a",
  "0x000000008000808b", "0x800000000000008b", "0x8000000000008089", "0x8000000000008003", "0x8000000000008002", "0x8000000000000080",
  "0x000000000000800a", "0x800000008000000a", "0x8000000080008081", "0x8000000000008080", "0x0000000080000001", "0x8000000080008008",

const ROT = [0, 1, 62, 28, 27, 36, 44, 6, 55, 20, 3, 10, 43, 25, 39, 41, 45, 15, 21, 8, 18, 2, 61, 56, 14];

      s[i] ^= v;
    }

      const c = []; for (let x = 0; x < 5; x++) c[x] = s[x] ^ s[x + 5] ^ s[x + 10] ^ s[x + 15] ^ s[x + 20];
      for (let x = 0; x < 5; x++) { const d = c[(x + 4) % 5] ^ rotl(c[(x + 1) % 5], 1); for (let y = 0; y < 25; y += 5) s[y + x] ^= d; }
      const b = new Array(25);
      for (let x = 0; x < 5; x++) for (let y = 0; y < 5; y++) b[y + 5 * ((2 * x + 3 * y) % 5)] = rotl(s[x + 5 * y], ROT[x + 5 * y]);
      for (let x = 0; x < 5; x++) for (let y = 0; y < 5; y++) s[x + 5 * y] = b[x + 5 * y] ^ (~b[(x + 1) % 5 + 5 * y] & M64 & b[(x + 2) % 5 + 5 * y]);

}
const K256 = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(bytes) {
  const l = bytes.length; const n = Math.ceil((l + 9) / 64) * 64; const m = new Uint8Array(n);
  m.set(bytes); m[l] = 0x80; const bits = l * 8;
  const dv = new DataView(m.buffer); dv.setUint32(n - 4, bits >>> 0); dv.setUint32(n - 8, Math.floor(bits / 2 ** 32));
  const h = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const w = new Uint32Array(64); const r = (x, k) => (x >>> k) | (x << (32 - k));
  for (let o = 0; o < n; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) { const s0 = r(w[i-15],7) ^ r(w[i-15],18) ^ (w[i-15] >>> 3); const s1 = r(w[i-2],17) ^ r(w[i-2],19) ^ (w[i-2] >>> 10); w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0; }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (hh + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K256[i] + w[i]) >>> 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;

    }

    h[4] = (h[4] + e) >>> 0; h[5] = (h[5] + f) >>> 0; h[6] = (h[6] + g) >>> 0; h[7] = (h[7] + hh) >>> 0;

}
const hex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
function cidDigest(cid) {
  // base32 (multibase "b") CIDv1: <version><codec><hash code><length><digest>
  if (cid[0] !== "b") throw new Error("unsupported CID encoding");

  for (const ch of cid.slice(1)) { val = (val << 5) | A.indexOf(ch); bits += 5; if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; } }
  let i = 0; const varint = () => { let x = 0, s = 0, b; do { b = out[i++]; x |= (b & 0x7f) << s; s += 7; } while (b & 0x80); return x; };

  return { code, digest: hex(out.slice(i, i + len)) };

async function fetchRaw(cid) {
  const r = await fetch(`/ipfs/${cid}?format=raw`, { cache: "no-store" });
  if (!r.ok) throw new Error(`${cid}: HTTP ${r.status}`);
  return new Uint8Array(await r.arrayBuffer());
}
async function verifyBlock(b) {
  const out = document.getElementById("vout");
  out.innerHTML = `<span class="muted">${t("verify.run")}</span>`;
  try {
    const hdr = await fetchRaw(b.ipfs.header);
    const hh = "0x" + hex(keccak256(hdr));
    if (hh !== b.hash) throw new Error(`header keccak ${hh} ≠ ${b.hash}`);
    const env = await fetchRaw(b.ipfs.root);
    const d = cidDigest(b.ipfs.root);
    const got = d.code === 0x12 ? hex(sha256(env)) : hex(keccak256(env));
    if (got !== d.digest) throw new Error("envelope digest mismatch");
    for (const c of b.ipfs.chunks) {
      const data = await fetchRaw(c); const cd = cidDigest(c);
      if (hex(sha256(data)) !== cd.digest) throw new Error("chunk " + c + " digest mismatch");
    }
    out.innerHTML = `<span class="badge ok">✓</span> ${t("verify.ok")}<div class="mono muted break">keccak256(header) = ${hh}</div>`;
  } catch (e) {
    out.innerHTML = `<span class="badge bad">✗</span> ${t("verify.bad")}: ${esc(e.message)}`;
  }
}

// ---------- routing & search ----------
document.getElementById("search").onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  try {
    const r = await api("search?q=" + encodeURIComponent(q));
    if (r.kind === "cid") location.href = `/ipfs/${r.id}?format=raw`;
    else location.hash = `#/${r.kind}/${r.id}`;
    document.getElementById("q").value = "";
  } catch (_) {
    $app.insertAdjacentHTML("afterbegin", `<div class="note">${t("search.none")}: ${esc(q)}</div>`);
  }
};
async function route() {
  clearInterval(timer);
  const h = location.hash.replace(/^#\/?/, "");
  const [path, qs] = h.split("?");
  const q = new URLSearchParams(qs || "");
  const [page, arg] = path.split("/");
  document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("on", a.dataset.nav === (page || "home")));
  loading();
  try {
    if (!page) await pageHome();
    else if (page === "blocks") await pageBlocks(q);
    else if (page === "block") await pageBlock(arg);
    else if (page === "tx") await pageTx(arg);
    else if (page === "address") await pageAddress(arg, q);
    else if (page === "validators") await pageValidators();
    else if (page === "validator") await pageValidator(arg);
    else if (page === "epoch") await pageEpoch(arg);
    else await pageHome();
    window.scrollTo(0, 0);
  } catch (e) { fail(e); }
}
window.addEventListener("hashchange", route);
applyTheme();
applyI18n();
route();
api("status").then((s) => { document.getElementById("net").textContent = s.chainId === 8017 ? "Mainnet" : s.chainId === 8018 ? "Testnet" : "Chain " + s.chainId; }).catch(() => {});
</script>
