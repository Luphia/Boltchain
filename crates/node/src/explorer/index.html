<style>
:root {
  /* Boltchain brand: deep navy, electric blue bolt, teal network mesh. Dark by default. */
  --bg: #0b0f17; --panel: #111823; --panel2: #0e141e; --text: #e7edf5; --muted: #8b9ab0; --line: #1e2938;
  --accent: #3b82e0; --accent2: #63b3ff; --accent-soft: rgba(59,130,224,.14); --teal: #6cc3bb;
  --ok: #4fc38a; --ok-soft: rgba(79,195,138,.13); --bad: #ff6b6b; --bad-soft: rgba(255,107,107,.13);
  --warn: #f0b64d; --warn-soft: rgba(240,182,77,.13); --link: #63b3ff; --code: #172131;
  --hdr: #0b0f17; --hdr-line: #1a2433; --shadow: none;
}
:root[data-theme="light"] {
  --bg: #f4f6fa; --panel: #ffffff; --panel2: #f8fafc; --text: #111827; --muted: #5f6b7d; --line: #e2e7ef;
  --accent: #2f6fcf; --accent2: #2f6fcf; --accent-soft: #e8f0fc; --teal: #2b8f86;
  --ok: #1f8a4c; --ok-soft: #e5f5ec; --bad: #c92a2a; --bad-soft: #fdecec; --warn: #a86b0c; --warn-soft: #fdf3e0;
  --link: #1f5fc4; --code: #eef2f7; --shadow: 0 1px 2px rgba(16,24,40,.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC",
    "Microsoft JhengHei", Roboto, sans-serif;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.muted { color: var(--muted); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
header.top { background: var(--hdr, #0b0f17); border-bottom: 1px solid var(--hdr-line, #1a2433); position: sticky; top: 0; z-index: 5; }
:root[data-theme="light"] header.top { --hdr: #0b0f17; --hdr-line: #0b0f17; }
.bar { display: flex; align-items: center; gap: 16px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand img { height: 26px; width: auto; display: block; }
.brand small { font-weight: 600; color: #6cc3bb; font-size: 11px; border: 1px solid #24405a; border-radius: 999px; padding: 1px 8px; letter-spacing: .04em; }
.brand:hover { text-decoration: none; }
nav.links { display: flex; gap: 14px; }
nav.links a { color: #8b9ab0; font-weight: 500; }
nav.links a.on, nav.links a:hover { color: #ffffff; text-decoration: none; }
form.search { flex: 1; display: flex; min-width: 0; }
form.search input {
  flex: 1; min-width: 0; height: 38px; border: 1px solid #22303f; border-radius: 10px 0 0 10px;
  background: #0f1622; color: #e7edf5; padding: 0 12px; font-size: 14px; outline: none;
}
form.search button { height: 38px; border: 0; background: linear-gradient(135deg, #4d9bf0, #2f6fcf); color: #fff; border-radius: 0 10px 10px 0; padding: 0 14px; cursor: pointer; font-weight: 600; }
.tools { display: flex; gap: 6px; }
.tools button { height: 32px; min-width: 32px; border: 1px solid #22303f; background: #0f1622; color: #cfd8e3; border-radius: 8px; cursor: pointer; font-size: 13px; padding: 0 8px; }
main.wrap { padding: 24px 16px 48px; }
h1 { font-size: 20px; margin: 4px 0 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2 { font-size: 15px; margin: 0; }
.grid { display: grid; gap: 12px; }
.grid > * { min-width: 0; }
.stats { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.stat { padding: 14px 16px; }
.stat .k { color: var(--muted); font-size: 12px; text-transform: none; }
.stat .v { font-size: 20px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } nav.links { display: none; } }
@media (max-width: 560px) { .brand small { display: none; } .bar { gap: 8px; } .brand img { height: 20px; } }
@media (max-width: 720px) { body.home form.search { visibility: hidden; } }
.card-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.list .row { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); min-width: 0; }
.list .row:last-child { border-bottom: 0; }
.row .ic { flex: none; width: 36px; height: 36px; border-radius: 9px; background: var(--code); display: grid; place-items: center; font-size: 12px; color: var(--muted); font-weight: 600; }
.row .main { flex: 1; min-width: 0; }
.row .main div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .side { text-align: right; flex: none; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; background: var(--code); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.acc { background: var(--accent-soft); color: var(--accent); }
table.kv { width: 100%; border-collapse: collapse; }
table.kv td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.kv tr:last-child td { border-bottom: 0; }
table.kv td:first-child { width: 220px; color: var(--muted); }
@media (max-width: 700px) { table.kv td { display: block; width: auto !important; } table.kv td:first-child { padding-bottom: 0; border-bottom: 0; } }
.break { word-break: break-all; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tbl th, table.tbl td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.tbl th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--bg); }
table.tbl td.r, table.tbl th.r { text-align: right; }
.scroll { overflow-x: auto; }
.pager { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.btn.acc { background: linear-gradient(135deg, #4d9bf0, #2f6fcf); border-color: transparent; color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.copy { cursor: pointer; color: var(--muted); margin-left: 6px; font-size: 12px; border: 0; background: none; }
.phase { padding: 16px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
@media (max-width: 700px) { .steps { grid-template-columns: 1fr; } }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.step.cur { border-color: var(--accent); background: var(--accent-soft); }
.step.done { opacity: .75; }
.step h3 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.step p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.meter { margin: 6px 0; font-size: 12px; }
.meter .t { display: flex; justify-content: space-between; color: var(--muted); }
.meter .b { height: 6px; background: var(--code); border-radius: 999px; overflow: hidden; margin-top: 3px; }
.meter .b i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--teal)); border-radius: 999px; }
.meter.full .b i { background: var(--ok); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.err { padding: 16px; border-radius: 12px; background: var(--bad-soft); color: var(--bad); }
.note { padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13px; margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.verify-out { margin-top: 8px; font-size: 13px; }
footer.wrap { color: var(--muted); font-size: 12px; padding: 20px 16px 32px; border-top: 1px solid var(--line); }
.spark { width: 100%; height: 44px; display: block; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.hero { position: relative; overflow: hidden; border-radius: 16px; margin-bottom: 16px; padding: 36px 28px 30px;
  background: radial-gradient(1200px 400px at 80% 0%, #13253a 0%, #0b0f17 60%); border: 1px solid #1a2433; color: #e7edf5; }
.hero svg.mesh { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; pointer-events: none; }
.hero .in { position: relative; max-width: 720px; }
.hero h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: .02em; }
.hero p { margin: 0 0 18px; color: #9fb0c6; }
.hero form { display: flex; }
.hero input { flex: 1; min-width: 0; height: 46px; border: 1px solid #27405a; border-radius: 12px 0 0 12px; background: rgba(11,15,23,.85); color: #e7edf5; padding: 0 14px; font-size: 15px; outline: none; }
.hero button { height: 46px; border: 0; background: linear-gradient(135deg, #4d9bf0, #2f6fcf); color: #fff; padding: 0 22px; border-radius: 0 12px 12px 0; font-weight: 700; cursor: pointer; }
</style>
</head>

}

function meter(label, cur, need, fmt = num) {

  for (let i = 0; i < n; i++) {
    const u = rnd() * w; const band = i % 2 ? 0.18 : 0.78;
    const v = (band + (rnd() - 0.5) * 0.42) * h + (u / w - 0.5) * h * (i % 2 ? 0.5 : -0.5);
    pts.push([u, v, 1 + rnd() * 2.2]);
  }
  let lines = "";
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const dx = pts[i][0] - pts[j][0], dy = pts[i][1] - pts[j][1];
    if (dx * dx + dy * dy < 95 * 95) lines += `<line x1="${pts[i][0].toFixed(1)}" y1="${pts[i][1].toFixed(1)}" x2="${pts[j][0].toFixed(1)}" y2="${pts[j][1].toFixed(1)}"/>`;
  }
  const dots = pts.map(([a, b, r]) => `<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${r.toFixed(1)}"/>`).join("");
  return `<svg class="mesh" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g stroke="#3f6f86" stroke-width=".7" opacity=".7">${lines}</g><g fill="#7fd0c8">${dots}</g></svg>`;
}
const MESH = mesh(1100, 300, 120, 7);
async function route() {

}
