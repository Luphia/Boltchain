[package]
name = "boltchain"
description = "Boltchain node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "boltchain"
path = "src/main.rs"

[dependencies]
bolt-primitives.workspace = true
bolt-exec.workspace = true
bolt-chain.workspace = true
bolt-store.workspace = true
bolt-txpool.workspace = true
bolt-rpc.workspace = true
bolt-net.workspace = true
bolt-sync.workspace = true
bolt-ipld.workspace = true
bolt-consensus.workspace = true
serde_ipld_dagcbor.workspace = true
alloy-rlp.workspace = true
bolt-system.workspace = true
libp2p.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-signer-local = "2.5"
alloy-network = "2.5"
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
k256 = { version = "0.13", features = ["ecdsa"] }
alloy-sol-types.workspace = true
bolt-pow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true

[dev-dependencies]
alloy-provider = { version = "2.5", default-features = false, features = ["reqwest"] }
alloy-rpc-types-eth = "2.5"
parking_lot.workspace = true
revm.workspace = true

[lints]
workspace = true
