[package]
name = "bolt-vault"
description = "Boltchain Vault: files split, encrypted and erasure-coded for IPFS, readable only by their recipients (ADR 0011)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde-wasm-bindgen"]

[dependencies]
chacha20poly1305 = "0.10"
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
rand_core = { version = "0.9", features = ["os_rng"] }
reed-solomon-erasure = "6"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = { version = "0.2.100", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# reed-solomon-erasure (via ahash) still uses getrandom 0.2
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
# reed-solomon-erasure (via parking_lot) uses `instant`, which needs this to run in a browser
instant = { version = "0.1", features = ["wasm-bindgen"] }
