name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is the target class of hardware (Raspberry Pi class, aarch64).
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy
      - name: libclang for libmdbx bindgen
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: release build size
        run: |
          cargo build --release -p boltchain
          ls -l target/release/boltchain
          ./target/release/boltchain genesis inspect genesis/devnet.json
      - name: block execution benchmark (worst-case pairing blocks)
        run: ./target/release/boltchain bench --blocks 5
      - name: consensus simulation (10,000 fault scenarios)
        if: matrix.os == 'ubuntu-24.04'
        run: cargo run --release -p bolt-sim -- --scenarios 10000

  contracts:
    name: system contracts are reproducible
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: compile with solc 0.8.30 and compare with contracts/out
        working-directory: contracts
        run: |
          npm ci
          node build.mjs --check

  statetest:
    name: osaka state tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/revme
          key: revme-43.0.3
      - run: scripts/statetest.sh
