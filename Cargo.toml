[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/cafeca/boltchain"
authors = ["CAFECA"]

[workspace.dependencies]
# internal
bolt-primitives = { path = "crates/primitives" }
bolt-ipld = { path = "crates/ipld" }
bolt-store = { path = "crates/store" }
bolt-exec = { path = "crates/exec" }
bolt-consensus = { path = "crates/consensus" }
bolt-net = { path = "crates/net" }
bolt-sync = { path = "crates/sync" }
bolt-txpool = { path = "crates/txpool" }
bolt-rpc = { path = "crates/rpc" }
bolt-sim = { path = "crates/sim" }

# ethereum
revm = { version = "43", default-features = false, features = ["std", "secp256k1", "c-kzg", "blst", "bn"] }
alloy-primitives = { version = "1.7", features = ["serde", "rlp"] }
alloy-rlp = "0.3"
alloy-trie = { version = "0.9", features = ["ethereum"] }
alloy-consensus = { version = "2.5", default-features = false, features = ["std", "serde", "k256"] }
alloy-eips = { version = "2.5", default-features = false, features = ["std", "serde"] }

# general
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
